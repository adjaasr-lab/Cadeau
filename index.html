<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Un petit cadeau ❤️</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;display:flex;justify-content:center;align-items:center;font-family:Georgia,serif;background:radial-gradient(circle at top,#ffe7ee,#f7c8d4 45%,#b86b7d);color:#3a1720;overflow-x:hidden;padding:20px 0}
.fall{position:fixed;top:-30px;pointer-events:none;z-index:1;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
.float{position:fixed;bottom:-30px;font-size:20px;opacity:.5;animation:float 8s linear infinite;pointer-events:none}
@keyframes float{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
.card{width:min(92vw,420px);text-align:center;position:relative;z-index:2}
h1{font-size:26px;margin:0 0 6px}
.sub{font:14px Arial,sans-serif;opacity:.7;margin-bottom:10px}
.gift-wrap{height:240px;display:flex;justify-content:center;align-items:center}
.gift{width:190px;height:170px;position:relative;cursor:pointer;transition:transform .3s;animation:bounce 2s ease-in-out infinite}
.gift.open{animation:none;cursor:default}
@keyframes bounce{50%{transform:translateY(-8px)}}
.box{position:absolute;bottom:0;width:190px;height:115px;background:linear-gradient(135deg,#d92f58,#a9153b);border-radius:8px;box-shadow:0 18px 35px #7d294055}
.box:before{content:"";position:absolute;left:74px;width:42px;height:100%;background:#f6c2cd}
.lid{position:absolute;bottom:105px;left:-8px;width:206px;height:42px;background:#ef4d73;border-radius:8px;transform-origin:left bottom;transition:transform .9s cubic-bezier(.3,1.4,.5,1);z-index:2}
.lid:before{content:"";position:absolute;left:82px;width:42px;height:100%;background:#f6c2cd}
.bow{position:absolute;top:-24px;left:79px;width:48px;height:30px}
.bow:before,.bow:after{content:"";position:absolute;width:34px;height:26px;border:7px solid #f6c2cd;border-radius:50% 50% 0 50%;top:0}
.bow:before{left:-22px;transform:rotate(25deg)}
.bow:after{right:-22px;transform:scaleX(-1) rotate(25deg)}
.open .lid{transform:translate(70px,-40px) rotate(-35deg);opacity:0;transition:transform .9s,opacity 1.2s .3s}
.message{display:none;background:#fff8fa;border-radius:20px;padding:22px 20px;box-shadow:0 15px 45px #6e243755;animation:appear .9s ease}
.message.show{display:block}
@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.photo{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-bottom:16px}
.message p{font-size:21px;line-height:1.5;margin:0;color:#a5163d}
.music{display:none;margin-top:18px}
.music.show{display:block}
.music button{border:0;border-radius:30px;padding:12px 20px;background:#a5163d;color:#fff;font-weight:700;font-size:15px}
.music iframe{display:none;width:100%;height:175px;border:0;border-radius:12px;margin-top:12px}
.music iframe.on{display:block}
</style>
</head>
<body>
<div id="bg"></div>
<div class="card">
  <h1>J'ai quelque chose pour toi…</h1>
  <div class="sub" id="sub">Clique sur le cadeau 🎁</div>
  <div class="gift-wrap">
    <div class="gift" id="gift">
      <div class="lid"><div class="bow"></div></div>
      <div class="box"></div>
    </div>
  </div>
  <div class="message" id="msg">
    <img class="photo" src="photo.jpg" alt="" onerror="this.style.display='none'">
    <p>Je t'offre mon cœur ❤️ et ça vaut plus que 400$.</p>
  </div>
  <div class="music" id="music">
    <button id="mbtn">🎵 Écouter notre chanson</button>
    <iframe id="player" allow="autoplay *; encrypted-media *;" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation" loading="lazy"></iframe>
  </div>
</div>
<script>
const MUSIC_URL="https://embed.music.apple.com/us/song/quebec/6818209990";
const emojis=["❤️","💕","💗","💖","🌹","✨"];
function rain(n){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='fall';s.textContent=emojis[Math.floor(Math.random()*emojis.length)];s.style.left=Math.random()*100+'vw';s.style.fontSize=(14+Math.random()*18)+'px';s.style.animationDuration=(3+Math.random()*3)+'s';s.style.animationDelay=(Math.random()*1.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),8000);}}
for(let i=0;i<6;i++){const s=document.createElement('span');s.className='float';s.textContent="❤️";s.style.left=(8+i*16)+'%';s.style.animationDelay=(i*1.3)+'s';document.getElementById('bg').appendChild(s);}
document.getElementById('gift').addEventListener('click',function(){
  if(this.classList.contains('open'))return;
  this.classList.add('open');
  document.getElementById('sub').style.display='none';
  rain(40);
  setTimeout(()=>{document.querySelector('.gift-wrap').style.display='none';document.getElementById('msg').classList.add('show');if(MUSIC_URL)document.getElementById('music').classList.add('show');rain(25);},1100);
});
document.getElementById('mbtn').addEventListener('click',()=>{const p=document.getElementById('player');p.src=MUSIC_URL;p.classList.add('on');});
</script>
</body>
</html>
